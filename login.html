<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    
    <title>login</title>
</head>
<body>
    <main>
        <h1>Bem-vindo!</h1>
        <p>Entre para acessar o sistema</p>

        <form id="formLogin">
            <div class="campo">
                <label for="usuario">Usuário: </label>
                <input type="text" id="usuario" placeholder="Digite seu usuário" required>
            </div>

            <div class="campo">
                <label for="senha">Senha: </label>
                <input type="password" id="senha" placeholder="Digite sua Senha" required>
            </div>

            <p id="mensagemErro" class="mensagem-erro"></p>

            <button type="submit" class="botao-principal">Entrar</button>
        </form>

        <p class="rodape">Sistema de Cadastro de Produto</p>
    </main>

    <script src="login.js"></script>
</body>
</html>
